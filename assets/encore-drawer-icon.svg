<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Encore-QoL button drawer icon: a plain drawstring bag on a red disc with a gold rim. Kept bold so it reads at 32 px. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe2a0"/><stop offset=".5" stop-color="#e09a45"/><stop offset="1" stop-color="#9a571c"/>
    </linearGradient>
    <radialGradient id="field" cx=".5" cy=".4" r=".65">
      <stop offset="0" stop-color="#c3140d"/><stop offset="1" stop-color="#5a0402"/>
    </radialGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c27a"/><stop offset="1" stop-color="#c4803a"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#gold)" stroke="#1d0802" stroke-width="12"/>
  <circle cx="256" cy="256" r="212" fill="url(#field)" stroke="#1d0802" stroke-width="10"/>
  <g transform="translate(256 270) scale(1.1) translate(-256 -270)">
  <g stroke="#1d0802" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
    <!-- neck flare -->
    <path d="M186 132L326 132L292 196L220 196Z" fill="url(#bag)"/>
    <!-- body -->
    <path d="M214 196C150 232 120 290 128 340C136 388 186 410 256 410C326 410 376 388 384 340C392 290 362 232 298 196Z" fill="url(#bag)"/>
    <!-- tie -->
    <path d="M200 198L312 198" fill="none"/>
  </g>
  <!-- one bold teal gem as the clasp -->
  <circle cx="256" cy="318" r="40" fill="#18c9c9" stroke="#1d0802" stroke-width="14"/>
  </g>
</svg>
