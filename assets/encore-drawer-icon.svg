<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Encore-QoL button drawer icon: the Encore star with a teal gem on the Encore frame (gold rim, teal ring, red field), muted to 78% colour and 95% brightness. -->
<defs>

<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0c4"/><stop offset=".22" stop-color="#f4b866"/><stop offset=".5" stop-color="#c47a2c"/><stop offset=".72" stop-color="#f2ad5c"/><stop offset="1" stop-color="#7a4313"/></linearGradient>
<radialGradient id="field" cx=".5" cy=".38" r=".7"><stop offset="0" stop-color="#d3170f"/><stop offset=".5" stop-color="#8f0805"/><stop offset="1" stop-color="#3c0100"/></radialGradient>
<linearGradient id="teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8fbf8"/><stop offset=".45" stop-color="#16cbcb"/><stop offset="1" stop-color="#046f70"/></linearGradient>
<radialGradient id="gem" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#e6ffff"/><stop offset=".4" stop-color="#22d6d6"/><stop offset="1" stop-color="#035c5d"/></radialGradient>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a4716"/><stop offset=".55" stop-color="#5a230a"/><stop offset="1" stop-color="#2a0c02"/></linearGradient>
<radialGradient id="leather" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#b8743a"/><stop offset=".55" stop-color="#6e3812"/><stop offset="1" stop-color="#2e1205"/></radialGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a8fbf8" stop-opacity=".95"/><stop offset=".45" stop-color="#16cbcb" stop-opacity=".5"/><stop offset="1" stop-color="#16cbcb" stop-opacity="0"/></radialGradient>
<radialGradient id="tealfield" cx=".5" cy=".38" r=".7"><stop offset="0" stop-color="#16a3a3"/><stop offset=".5" stop-color="#065a5b"/><stop offset="1" stop-color="#012526"/></radialGradient>
<filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".65"/></filter>
<symbol id="star" viewBox="-40 -40 80 80"><path d="M0-38L11-11 38 0 11 11 0 38-11 11-38 0-11-11Z" fill="url(#gold)" stroke="#2a1404" stroke-width="3"/><path d="M0-15L7 0 0 15-7 0Z" fill="url(#gem)" stroke="#2a1404" stroke-width="1.5"/></symbol>
<clipPath id="fc"><circle cx="256" cy="256" r="196"/></clipPath>
<filter id="tone" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values=".78"/><feComponentTransfer><feFuncR type="linear" slope=".95"/><feFuncG type="linear" slope=".95"/><feFuncB type="linear" slope=".95"/></feComponentTransfer></filter></defs><g filter="url(#tone)"><g filter="url(#drop)"><circle cx="256" cy="256" r="240" fill="url(#gold)" stroke="#1d0802" stroke-width="9"/><circle cx="256" cy="256" r="220" fill="#1b0a03"/><circle cx="256" cy="256" r="213" fill="none" stroke="url(#teal)" stroke-width="6"/><circle cx="256" cy="256" r="206" fill="url(#field)"/></g><g transform="translate(256 256) scale(1.2) translate(-256 -256)"><path d="M256 96L290 222 416 256 290 290 256 416 222 290 96 256 222 222Z" fill="url(#gold)" stroke="#1d0802" stroke-linejoin="round" stroke-width="8" filter="url(#drop)"/><path d="M256 186L282 256 256 326 230 256Z" fill="url(#gem)" stroke="#1d0802" stroke-linejoin="round" stroke-width="5"/></g></g></svg>