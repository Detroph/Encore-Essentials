# Builds the CurseForge zip with the BigWigs packager.
# Push a tag like v0.1.0 (release), v0.2.0-beta1 (beta) or v0.2.0-alpha1 (alpha) to upload.
# Or run it from the Actions tab (Run workflow) with a tag name: it tags the head of main and releases that.
# Needs the repository secret CF_API_KEY and "## X-Curse-Project-ID:" in EncoreEssentials/EncoreEssentials.toc.
name: Package and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create on main and release, like v0.1.5"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the tag (Run workflow only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)[0-9]*)?$ ]] || { echo "bad tag: $TAG"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then echo "$TAG already exists"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
      - uses: BigWigsMods/packager@v2
